<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Terminal</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden; }
      /* Drag this edge to change how much of the window the terminal takes. */
      #grip { position: fixed; left: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; background: #2a2e36; }
      #grip:hover, #grip.dragging { background: #40c8be; }
      #term { position: fixed; left: 11px; right: 2px; top: 4px; bottom: 2px; }
    </style>
  </head>
  <body>
    <div id="grip"></div>
    <div id="term"></div>
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
    <script type="module" src="terminal.js"></script>
  </body>
</html>
