[package]
name = "enkad-mcp"
version = "0.1.0"
description = "Standalone window for the EnKA AIC planner with a built-in MCP server"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables several webviews in one window (planner now, terminal pane later).
tauri = { version = "2", features = ["unstable"] }
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Must match the versions tauri/wry resolve to, since we share their COM objects.
webview2-com = "0.39"
windows-core = "0.62"
